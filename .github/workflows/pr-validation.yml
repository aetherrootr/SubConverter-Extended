name: PR Validation

on:
  pull_request:
    branches: [dev, master]

permissions: {}

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: Source validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Validate pinned dependencies and fork release checks
        run: |
          python3 scripts/ci/dependency_snapshot.py check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node --test .github/scripts/dependabot-maintenance.test.cjs
          bash -n scripts/ci/*.sh

  candidate:
    name: Build and smoke test candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve build identity
        id: metadata
        run: python3 scripts/ci/build_metadata.py --github-output "$GITHUB_OUTPUT"
      - name: Load pinned dependencies
        run: |
          python3 scripts/ci/dependency_snapshot.py check
          python3 scripts/ci/dependency_snapshot.py emit --github-env "$GITHUB_ENV"
      - name: Prepare build arguments
        id: docker_args
        env:
          THREADS: '4'
          SHA: ${{ steps.metadata.outputs.sha }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_DATE: ${{ steps.metadata.outputs.build_date }}
        run: |
          {
            echo 'args<<BUILD_ARGS_END'
            bash scripts/ci/docker-build-args.sh
            echo 'BUILD_ARGS_END'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Build candidate image
        env:
          BUILD_ARGS: ${{ steps.docker_args.outputs.args }}
        run: bash scripts/ci/build-candidate-image.sh amd64 ./Dockerfile linux/amd64
      - name: Smoke test candidate image
        timeout-minutes: 10
        uses: ./.github/actions/smoke-docker-image
        with:
          image: subconverter-extended:amd64-ci
          platform: linux/amd64
          expected-version: ${{ steps.metadata.outputs.version }}
          expected-revision: ${{ steps.metadata.outputs.sha }}
          expected-build-date: ${{ steps.metadata.outputs.build_date }}

  gate:
    name: PR Gate
    if: always()
    runs-on: ubuntu-24.04
    needs: [source-validation, candidate]
    permissions: {}
    steps:
      - name: Require fork validation
        env:
          SOURCE_RESULT: ${{ needs.source-validation.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$CANDIDATE_RESULT" = success
